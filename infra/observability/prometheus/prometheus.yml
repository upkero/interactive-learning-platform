global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT:-local}

scrape_configs:
  - job_name: grasp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: grasp-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
