name: grasp

# Базовый якорь конфигурации для сервисов на Python
x-backend: &backend
  build:
    context: ../backend
    target: runtime
  image: grasp-backend:dev
  env_file: ../backend/.env

# Условие: сервисы стартуют только после готовности БД, Redis, MinIO и выполнения миграций
x-backend-deps: &backend-deps
  db: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio-init: { condition: service_completed_successfully }
  migrate: { condition: service_completed_successfully }

services:
  # 1. База данных PostgreSQL 17 с расширением pgvector
  db:
    image: pgvector/pgvector:pg17
    env_file: ../backend/.env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # 2. Redis (очередь Celery, стримы прогресса, кэш)
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # 3. MinIO — S3-совместимое объектное хранилище
  # AIStor-образ не стартует без лицензии: файл кладётся в infra/license/minio.license
  # (не коммитится, см. .gitignore; reference — docker-compose.yml faq-assistant).
  minio:
    # Our licensed AIStor build (Free license from SUBNET only works on edge
    # builds after 2026-10-29) pinned by digest — quay purges superseded
    # edge-daily manifests within days, so re-pin when this dies with
    # "not found" / renders "manifest unknown": see the comment in
    # .github/workflows/ci.yml (same digest there). PENDING (lead): copy
    # via the one-off publish-minio-copy workflow to our private GHCR
    # (ghcr.io/upkero/interactive-learning-platform/aistor-minio) and move
    # this pin there for good; docker login ghcr.io once for local pulls.
    image: quay.io/minio/aistor/minio@sha256:869afa6cb6731d87e23cdb4bbe7e4bce4bb15ae82ea657282031738c8cb70831
    command: server /data --console-address ":9001" --license /minio.license
    env_file: ../backend/.env
    ports: ["9000:9000", "9001:9001"]
    # NOTE: AIStor builds since ~2026-11-08 reject ext4-backed docker
    # volumes (the drive formats and then never comes online: every S3
    # request 403 AccessDenied while /minio/health still answers 200).
    # The data drive must be XFS: /srv/minio-dev is a 20G loop-image
    # formatted once via fstab — setup in AGENTS.md ("MinIO gotchas").
    volumes:
      - /srv/minio-dev:/data
      - ./license/minio.license:/minio.license:ro
    healthcheck:
      # Современные образы MinIO не содержат curl; в них есть mc с алиасом local
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      retries: 10

  # 4. Инициализация бакетов документов и картинок в MinIO
  minio-init:
    # quay.io/minio/mc on quay is dead (401 for every tag — MinIO dropped
    # the community repos 2026-09) and Docker Hub minio/mc is gone as well.
    # The AIStor runtime image ships mc (the minio healthcheck uses it), so
    # the init job piggybacks on the same pinned image — no separate mc
    # repository. The entrypoint fully replaces the image default, so the
    # MinIO server never starts here.
    image: quay.io/minio/aistor/minio@sha256:869afa6cb6731d87e23cdb4bbe7e4bce4bb15ae82ea657282031738c8cb70831
    depends_on:
      minio: { condition: service_healthy }
    env_file: ../backend/.env
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_DOCUMENTS local/$$S3_BUCKET_IMAGES"
    restart: "no"

  # 5. Одноразовый запуск миграций базы данных
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    # В миграциях нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }
    restart: "no"

  # 6. Основной API бэкенда (FastAPI)
  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on: *backend-deps

  # 7. Воркер фоновых задач Celery
  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "worker",
        "-Q",
        "maintenance,parts.high,parts",
        "--concurrency=2",
        "--loglevel=INFO",
      ]
    depends_on: *backend-deps
    networks:
      - default
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # 8. Планировщик периодических задач Celery Beat
  beat:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "beat",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    depends_on: *backend-deps
    # В beat нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }

  # 9. Изолированная песочница для безопасного рендера виджетов
  sandbox:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    mem_limit: 1g
    networks:
      - sandbox_net

  # 10. Локальная LLM Ollama (для работы без платного ключа)
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

  # 11. Deterministic demo seed (runs and exits); enabled with --profile seed
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["python", "-m", "src.cli", "seed-dev", "--fake-embeddings"]
    depends_on: *backend-deps
    volumes:
      - ../primitives/dist:/app/primitives-dist:ro
      # JSON fixtures of the seed data (source of the demo documents/widgets)
      - ../backend/tests/support/fixtures/seed:/app/tests/support/fixtures/seed:ro
    restart: "no"

networks:
  sandbox_net:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  ollamadata: {}
