name: grasp

# Базовый якорь конфигурации для сервисов на Python
x-backend: &backend
  build:
    context: ../backend
    target: runtime
  image: grasp-backend:dev
  env_file: ../backend/.env

# Условие: сервисы стартуют только после готовности БД, Redis, MinIO и выполнения миграций
x-backend-deps: &backend-deps
  db: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio-init: { condition: service_completed_successfully }
  migrate: { condition: service_completed_successfully }

services:
  # 1. База данных PostgreSQL 17 с расширением pgvector
  db:
    image: pgvector/pgvector:pg17
    env_file: ../backend/.env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # 2. Redis (очередь Celery, стримы прогресса, кэш)
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # 3. MinIO — S3-совместимое объектное хранилище
  # AIStor-образ не стартует без лицензии: файл кладётся в infra/license/minio.license
  # (не коммитится, см. .gitignore; reference — docker-compose.yml faq-assistant).
  minio:
    # Наша приватная копия AIStor-образа MinIO в GHCR (пакет aistor-minio,
    # публикуется воркфлоу publish-minio-copy), закреплённая по digest:
    # quay удаляет устаревшие daily-сборки через несколько дней. Обновление
    # образа = новый SOURCE/TARGET в publish-minio-copy.yml и новый digest
    # здесь и в ci.yml одним PR.
    image: ghcr.io/upkero/interactive-learning-platform/aistor-minio@sha256:03f71816a1761e6b46228e2bdb856c43285f031cfcd02f922e7781841826f838
    command: server /data --console-address ":9001" --license /minio.license
    env_file: ../backend/.env
    ports: ["9000:9000", "9001:9001"]
    # Диск данных обязан быть XFS: свежие сборки AIStor отказываются
    # форматировать ext4-тома и остаются офлайн; путь задаёт MINIO_DATA_DIR
    # из backend/.env (разовая настройка диска — docs/minio-xfs.md).
    volumes:
      - ${MINIO_DATA_DIR:?MINIO_DATA_DIR must point to an XFS directory, see docs/minio-xfs.md}:/data
      - ./license/minio.license:/minio.license:ro
    healthcheck:
      # Современные образы MinIO не содержат curl; в них есть mc с алиасом local
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      retries: 10

  # 4. Инициализация бакетов документов и картинок в MinIO
  minio-init:
    # Отдельный образ mc больше не публикуется (quay, Docker Hub), поэтому
    # job использует mc из того же AIStor-образа; entrypoint полностью
    # заменяет дефолт, так что сервер MinIO здесь не стартует.
    image: ghcr.io/upkero/interactive-learning-platform/aistor-minio@sha256:03f71816a1761e6b46228e2bdb856c43285f031cfcd02f922e7781841826f838
    depends_on:
      minio: { condition: service_healthy }
    env_file: ../backend/.env
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_DOCUMENTS local/$$S3_BUCKET_IMAGES"
    restart: "no"

  # 5. Одноразовый запуск миграций базы данных
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    # В миграциях нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }
    restart: "no"

  # 6. Основной API бэкенда (FastAPI)
  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on: *backend-deps

  # 7. Воркер фоновых задач Celery
  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "worker",
        "-Q",
        "maintenance,parts.high,parts",
        "--concurrency=2",
        "--loglevel=INFO",
      ]
    depends_on: *backend-deps
    networks:
      - default
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # 8. Планировщик периодических задач Celery Beat
  beat:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "beat",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    depends_on: *backend-deps
    # В beat нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }

  # 9. Изолированная песочница для безопасного рендера виджетов
  sandbox:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    mem_limit: 1g
    networks:
      - sandbox_net

  # 10. Локальная LLM Ollama (для работы без платного ключа)
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

  # 11. Deterministic demo seed (runs and exits); enabled with --profile seed
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["python", "-m", "src.cli", "seed-dev", "--fake-embeddings"]
    depends_on: *backend-deps
    volumes:
      - ../primitives/dist:/app/primitives-dist:ro
      # JSON fixtures of the seed data (source of the demo documents/widgets)
      - ../backend/tests/support/fixtures/seed:/app/tests/support/fixtures/seed:ro
    restart: "no"

networks:
  sandbox_net:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  ollamadata: {}
