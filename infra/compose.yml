name: grasp

# Базовый якорь конфигурации для сервисов на Python
x-backend: &backend
  build:
    context: ../backend
    target: runtime
  image: grasp-backend:dev
  env_file: ../backend/.env

# Условие: сервисы стартуют только после готовности БД, Redis, MinIO и выполнения миграций
x-backend-deps: &backend-deps
  db: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio-init: { condition: service_completed_successfully }
  migrate: { condition: service_completed_successfully }

services:
  # 1. База данных PostgreSQL 17 с расширением pgvector
  db:
    image: pgvector/pgvector:pg17
    env_file: ../backend/.env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # 2. Redis (очередь Celery, стримы прогресса, кэш)
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # 3. MinIO — S3-совместимое объектное хранилище
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    env_file: ../backend/.env
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      # Современные образы MinIO не содержат curl; в них есть mc с алиасом local
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      retries: 10

  # 4. Инициализация бакетов документов и картинок в MinIO
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    env_file: ../backend/.env
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_DOCUMENTS local/$$S3_BUCKET_IMAGES"
    restart: "no"

  # 5. Одноразовый запуск миграций базы данных
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    # В миграциях нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }
    restart: "no"

  # 6. Основной API бэкенда (FastAPI)
  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on: *backend-deps

  # 7. Воркер фоновых задач Celery
  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "worker",
        "-Q",
        "maintenance,parts.high,parts",
        "--concurrency=2",
        "--loglevel=INFO",
      ]
    depends_on: *backend-deps
    networks:
      - default
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # 8. Планировщик периодических задач Celery Beat
  beat:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "src.worker",
        "beat",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    depends_on: *backend-deps
    # В beat нет веб-сервера — HTTP-healthcheck из Dockerfile неуместен
    healthcheck: { disable: true }

  # 9. Изолированная песочница для безопасного рендера виджетов
  sandbox:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    mem_limit: 1g
    networks:
      - sandbox_net

  # 10. Локальная LLM Ollama (для работы без платного ключа)
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

networks:
  sandbox_net:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  ollamadata: {}
