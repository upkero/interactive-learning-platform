# ==============================================================================
# Grasp — production reverse proxy (см. docs/adr/0009-deployment.md).
# Замените grasp.example на ваш базовый домен во всех доменах ниже:
#   app.<домен>    — клиентское приложение (Next.js)
#   api.<домен>    — бэкенд FastAPI
#   widgets.<домен> — хост iframe-виджетов (изолированный sandbox-домен)
#   files.<домен>  — MinIO (presigned-ссылки на картинки)
# Сертификаты Let's Encrypt монтируются read-only из /etc/letsencrypt,
# выпуск/продление делает certbot на хосте в режиме webroot (/var/www/certbot).
# ==============================================================================

# HTTP: ACME-challenge, локальный healthcheck и редирект на HTTPS
server {
    listen 80;
    server_name app.grasp.example api.grasp.example widgets.grasp.example files.grasp.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck из compose: конечный 2xx без редиректа на TLS
    location = /healthz {
        access_log off;
        return 200;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.grasp.example;

    ssl_certificate /etc/letsencrypt/live/grasp.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grasp.example/privkey.pem;

    # 50 MB документ + запас на multipart-заголовки
    client_max_body_size 55m;

    # Метрики Prometheus недоступны снаружи
    location = /metrics {
        deny all;
    }

    # SSE-потоки прогресса: без буферизации, длинный таймаут чтения
    location ~ ^/api/v1/documents/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Файлы (MinIO): Host $host обязателен — MinIO проверяет подпись presigned-ссылки
server {
    listen 443 ssl;
    http2 on;
    server_name files.grasp.example;

    ssl_certificate /etc/letsencrypt/live/grasp.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grasp.example/privkey.pem;

    client_max_body_size 55m;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

# Клиентское приложение
server {
    listen 443 ssl;
    http2 on;
    server_name app.grasp.example;

    ssl_certificate /etc/letsencrypt/live/grasp.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grasp.example/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Widget-host (iframe-виджеты)
server {
    listen 443 ssl;
    http2 on;
    server_name widgets.grasp.example;

    ssl_certificate /etc/letsencrypt/live/grasp.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grasp.example/privkey.pem;

    location / {
        proxy_pass http://widget-host:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
