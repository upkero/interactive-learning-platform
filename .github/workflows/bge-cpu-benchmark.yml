name: BGE-M3 CPU benchmark

on:
  push:
    branches:
      - feat/SCRUM-2.3-widget-search
    paths:
      - .github/workflows/bge-cpu-benchmark.yml

permissions:
  contents: read

jobs:
  bge-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_DB: grasp_benchmark
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U grasp -d grasp_benchmark" --health-interval 5s --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      BGE_REVISION: 5617a9f61b028005a4858fdac845db406aefb181
      BGE_WEIGHTS_SHA256: b5e0ce3470abf5ef3831aa1bd5553b486803e83251590ab7ff35a117cf6aad38
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      EMBEDDINGS_PROVIDER: bge_m3
      EMBEDDINGS_DEVICE: cpu
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Configure job-local paths
        run: |
          printf 'HF_HOME=%s/ilp-bge-hf\nRESULTS_DIR=%s/ilp-bge-results\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install locked CPU dependencies
        run: uv sync --locked --extra embeddings-local

      - name: Initialize pgvector
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U grasp -d grasp_benchmark -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION vector' \
            -c "SELECT version(), extversion FROM pg_extension WHERE extname = 'vector'"

      - name: Cache the pinned BGE-M3 checkpoint
        run: |
          .venv/bin/hf download BAAI/bge-m3 \
            1_Pooling/config.json config.json config_sentence_transformers.json modules.json \
            pytorch_model.bin sentence_bert_config.json sentencepiece.bpe.model \
            special_tokens_map.json tokenizer.json tokenizer_config.json \
            --revision "$BGE_REVISION"
          cache="$HF_HOME/hub/models--BAAI--bge-m3"
          weights="$cache/snapshots/$BGE_REVISION/pytorch_model.bin"
          printf '%s  %s\n' "$BGE_WEIGHTS_SHA256" "$weights" | sha256sum --check
          # The production wrapper requests the default revision by model ID.
          mkdir -p "$cache/refs"
          printf '%s' "$BGE_REVISION" > "$cache/refs/main"

      - name: Measure CPU retrieval on the labeled corpus
        env:
          DB_URL: postgresql+asyncpg://grasp:grasp@127.0.0.1:${{ job.services.postgres.ports[5432] }}/grasp_benchmark
          HF_HUB_OFFLINE: "1"
        run: |
          mkdir -p "$RESULTS_DIR"
          {
            printf 'Git SHA %s\nBGE revision %s\nWeights SHA-256 %s\n' "$GITHUB_SHA" "$BGE_REVISION" "$BGE_WEIGHTS_SHA256"
            printf 'OMP_NUM_THREADS=%s\nMKL_NUM_THREADS=%s\n' "$OMP_NUM_THREADS" "$MKL_NUM_THREADS"
            uname -a
            lscpu
            free -h
            uv --version
            .venv/bin/python --version
            .venv/bin/python - <<'PY'
          from importlib.metadata import version

          for package in ("torch", "sentence-transformers", "transformers", "huggingface-hub", "pgvector"):
              print(f"{package} {version(package)}")
          PY
          } > "$RESULTS_DIR/hardware.txt"
          uv run --no-sync python -m evals.embeddings_benchmark | tee "$RESULTS_DIR/bge-m3.json"

      - name: Add benchmark metrics to the job summary
        run: |
          .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULTS_DIR"])
          result = json.loads((root / "bge-m3.json").read_text())
          test = result["test_unfiltered"]
          print("## BGE-M3 CPU benchmark")
          print()
          print(f"- Corpus SHA-256 `{result['corpus_sha256']}`")
          print(f"- Recall@1 {test['recall_at_1']:.4f}")
          print(f"- Recall@5 {test['recall_at_5']:.4f}")
          print(f"- MRR@5 {test['mrr_at_5']:.4f}")
          print(f"- Batch p95 {result['p95_batch_seconds']:.4f} s (batch size {result['batch_size']})")
          print(f"- Calibrated cosine-distance threshold {result['calibrated_max_distance']}")
          print(f"- API cost USD {result['api_cost_usd']:.2f}")
          print()
          print("```text")
          print((root / "hardware.txt").read_text().rstrip())
          print("```")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bge-m3-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/ilp-bge-results/
          retention-days: 7
          if-no-files-found: ignore
