# One-off tool: copies the pinned, license-validated MinIO (AIStor) image
# from quay into our private GHCR namespace, where nothing garbage-collects
# it. Runs automatically on any push that touches this file (so it works
# from a PR branch, where workflow_dispatch is hidden), plus manually:
# Actions → publish-minio-copy → Run workflow.
# The digest it prints ("PIN THIS DIGEST") goes into ci.yml and
# infra/compose.yml, replacing the quay source pin for good.
name: publish-minio-copy

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-minio-copy.yml

env:
  # The MinIO FREE license (issued 2026-10-29) is only accepted by
  # edge-daily builds published after it; the digest below is one such
  # build, pinned by manifest digest so quay's purge of superseded
  # edge-daily tags cannot silently change what gets copied.
  SOURCE: quay.io/minio/aistor/minio@sha256:65ba851d715e4f5c58851eb751922fc903011175c8f652d41a6438dfe9eb00e6
  TARGET: ghcr.io/${{ github.repository }}/aistor-minio:2026-11-10

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get crane (registry copy tool)
        # The tarball is verified against the release's checksums.txt
        # before anything from it is executed.
        run: |
          version=0.22.1
          curl -sfL "https://github.com/google/go-containerregistry/releases/download/v${version}/go-containerregistry_Linux_x86_64.tar.gz" -o go-containerregistry_Linux_x86_64.tar.gz
          curl -sfL "https://github.com/google/go-containerregistry/releases/download/v${version}/checksums.txt" -o checksums.txt
          grep "go-containerregistry_Linux_x86_64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf go-containerregistry_Linux_x86_64.tar.gz crane
          ./crane version

      # Path-style names (OWNER/REPO/IMAGE) are created only through the
      # Actions GITHUB_TOKEN — a personal access token is denied
      # (create_package), which is why this runs here.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | ./crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy the pinned build from quay
        run: ./crane copy --platform linux/amd64 "$SOURCE" "$TARGET"

      - name: Report the GHCR digest to pin
        run: |
          digest=$(./crane digest "$TARGET")
          echo "PIN THIS DIGEST in ci.yml and infra/compose.yml: ${digest}"
