name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python backend checks
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: grasp_test
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
        ports:
          - "5432:5432"
        options: --health-cmd "pg_isready -U grasp" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: postgresql+asyncpg://grasp:grasp@localhost:5432/grasp_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long
      SEED_PASSWORD: ci-seed-password
      # MinIO raised below, admin creds match the dev defaults in compose
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      # MinIO is a docker-run step, not a `services:` entry: the AIStor image
      # refuses to start without the license file, and service containers
      # cannot mount one from a secret (review Б2: fail, never skip).
      # `edge-daily` is the only image published after the FREE license was
      # issued (2026-10-29): older tags reject it with "invalid JWT" because
      # they predate the license's ES384 signing key. Pin by digest once this
      # is green so the daily rebuild cannot break the workflow silently.
      - name: Start MinIO (AIStor, license from the CI secret)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/infra/license"
          # fail loudly before the server runs without a license
          if [ -z "${{ secrets.MINIO_LICENSE_B64 }}" ]; then
            echo "::error::Secret MINIO_LICENSE_B64 is empty. Set it to the base64 of infra/license/minio.license (single line)."
            exit 1
          fi
          printf '%s' "${{ secrets.MINIO_LICENSE_B64 }}" | base64 -d > "${GITHUB_WORKSPACE}/infra/license/minio.license"
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -v "${GITHUB_WORKSPACE}/infra/license/minio.license:/minio.license:ro" \
            quay.io/minio/aistor/minio:edge-daily \
            server /data --console-address ":9001" --license /minio.license

      - name: Wait for MinIO to go live
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: License diagnostics (fingerprint only, never contents)
        run: |
          echo "license file inside the container:"
          docker exec minio sh -c "wc -c /minio.license && sha256sum /minio.license"
          docker exec minio mc license info local || true
          echo "MinIO logs (look for license parse/acceptance lines):"
          docker logs minio 2>&1 | grep -i license || true

      - name: Create documents and images buckets (as minio-init does)
        run: |
          if ! docker exec minio /bin/sh -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/documents local/images"; then
            echo "mc mb failed; full MinIO logs:"
            docker logs minio
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint and format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy src tests

      - name: Database migrations check
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head

      - name: Model/schema consistency check (alembic check)
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -m "unit or integration" --maxfail=1

  # ---------------------------------------------------------------------------
  # 2. Web package checks (frontend, sandbox, primitives)
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint and test packages
        run: pnpm -r lint && pnpm -r typecheck && pnpm -r test

      - name: Build packages
        run: pnpm -r build

  # ---------------------------------------------------------------------------
  # 3. Storybook checks (visual catalogue)
  # ---------------------------------------------------------------------------
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and run Storybook
        run: pnpm --filter @grasp/primitives build-storybook && pnpm --filter @grasp/primitives test-storybook

  # ---------------------------------------------------------------------------
  # 4. Docker image builds
  # ---------------------------------------------------------------------------
  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    # Permission to publish images to GHCR
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, sandbox, widget-host]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'backend' && 'backend' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 5. E2E placeholder (filled in by task 4.4.3)
  # ---------------------------------------------------------------------------
  e2e:
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E2E pipeline placeholder
        run: echo "E2E pipeline placeholder (configured in task 4.4.3)"
