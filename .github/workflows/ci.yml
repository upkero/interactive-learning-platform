name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python backend checks
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: grasp_test
          POSTGRES_USER: grasp
          POSTGRES_PASSWORD: grasp
        ports:
          - "5432:5432"
        options: --health-cmd "pg_isready -U grasp" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: postgresql+asyncpg://grasp:grasp@localhost:5432/grasp_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long
      SEED_PASSWORD: ci-seed-password
      # MinIO raised below, admin creds match the dev defaults in compose
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      # MinIO timeline (see REVIEW_1_3.md and infra/compose.yml):
      # - quay.io/minio/mc is dead (MinIO dropped community repos, 2026-09);
      #   bucket init now reuses mc from inside the AIStor image (below).
      # - quay purges superseded edge-daily manifests within days: the
      #   10-31 build died 11-06 (observed), the 11-06 10:27 build died
      #   ~11-09 as well ("docker pull ... not found"). Re-pin to the live
      #   `edge-daily` digest:
      #   docker manifest inspect quay.io/minio/aistor/minio:edge-daily
      #   PENDING (lead): run the one-off publish-minio-copy workflow to
      #   stash the build in our private GHCR, then switch this pin and
      #   infra/compose.yml to ghcr.io/upkero/interactive-learning-platform/
      #   aistor-minio@sha256:<ghcr-digest> for good — quay churn stops
      #   hurting CI (the workflow currently copies the 2026-11-10 digest).
      # - fresh builds (>~11-08) REFUSE ext4-backed docker volumes: the
      #   drive formats and then never comes online ("drives-online: 0",
      #   every S3 call 403 while /minio/health still answers 200 — the
      #   wait loop below would never see /health/ready). The runners
      #   format /var/lib/docker as ext4, so give MinIO a small XFS drive,
      #   same trick as the local dev setup (/srv/minio-dev, see AGENTS.md).
      - name: Prepare an XFS drive for MinIO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs
          sudo truncate -s 2G /srv/minio-dev.xfs
          sudo mkfs.xfs -q /srv/minio-dev.xfs
          sudo mkdir -p /srv/minio-data
          sudo mount -o loop /srv/minio-dev.xfs /srv/minio-data

      - name: Start MinIO (AIStor, license from the CI secret)
        env:
          # keep the secret out of the command text (GitHub recommends env)
          MINIO_LICENSE_B64: ${{ secrets.MINIO_LICENSE_B64 }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/infra/license"
          # fail loudly before the server runs without a license
          if [ -z "$MINIO_LICENSE_B64" ]; then
            echo "::error::Secret MINIO_LICENSE_B64 is empty. Set it to the base64 of infra/license/minio.license (single line)."
            exit 1
          fi
          printf '%s' "$MINIO_LICENSE_B64" | base64 -d > "${GITHUB_WORKSPACE}/infra/license/minio.license"
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -v "${GITHUB_WORKSPACE}/infra/license/minio.license:/minio.license:ro" \
            -v /srv/minio-data:/data \
            quay.io/minio/aistor/minio@sha256:869afa6cb6731d87e23cdb4bbe7e4bce4bb15ae82ea657282031738c8cb70831 \
            server /data --console-address ":9001" --license /minio.license

      - name: Wait for MinIO to become ready (live, then readable)
        run: |
          # /minio/health/live is process-alive only: the current daily
          # build finishes formatting its pool AFTER the live endpoint
          # answers and early `mc` traffic fails with "drives-online: 0".
          # Wait for /health/ready (read quorum established) instead.
          for _ in $(seq 1 60); do
            if ! curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              sleep 1
              continue
            fi
            if curl -sf http://localhost:9000/minio/health/ready > /dev/null; then
              echo "MinIO is live and ready"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Create documents and images buckets (as minio-init does)
        run: |
          # Retry a few times: right after formatting, a first mb call can
          # still land inside the pool's quorum-emergence window.
          ok=""
          for _ in $(seq 1 15); do
            if docker exec minio /bin/sh -c \
              "mc alias set local http://localhost:9000 minioadmin minioadmin &&
               mc mb --ignore-existing local/documents local/images"; then
              ok=1
              break
            fi
            echo "mc mb attempt failed; retrying."
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "mc mb failed after retries; full MinIO logs:"
            docker logs minio
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint and format check
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy src tests

      - name: Database migrations check
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head

      - name: Model/schema consistency check (alembic check)
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -m "unit or integration" --maxfail=1

  # ---------------------------------------------------------------------------
  # 2. Web package checks (frontend, sandbox, primitives)
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint and test packages
        run: pnpm -r lint && pnpm -r typecheck && pnpm -r test

      - name: Build packages
        run: pnpm -r build

  # ---------------------------------------------------------------------------
  # 3. Storybook checks (visual catalogue)
  # ---------------------------------------------------------------------------
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and run Storybook
        run: pnpm --filter @grasp/primitives build-storybook && pnpm --filter @grasp/primitives test-storybook

  # ---------------------------------------------------------------------------
  # 4. Docker image builds
  # ---------------------------------------------------------------------------
  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    # Permission to publish images to GHCR
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, sandbox, widget-host]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'backend' && 'backend' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 5. E2E placeholder (filled in by task 4.4.3)
  # ---------------------------------------------------------------------------
  e2e:
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E2E pipeline placeholder
        run: echo "E2E pipeline placeholder (configured in task 4.4.3)"
